[project]
name = "agent-gateway"
version = "2.0.0"
description = "Self-hosted, local-first LLM proxy for context management in long-running agent loops"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "tiktoken>=0.7",
    "tokenizers>=0.19",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anthropic>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_gateway*"]

[tool.setuptools.package-data]
"agent_gateway.core" = ["vocab/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
