name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "BENCHMARKS.md"
      - "benchmarks/raw_results.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r website/. _site/
          mkdir -p _site/benchmarks
          cp -r docs/. _site/benchmarks/
          if [ -f benchmarks/raw_results.json ]; then
            cp benchmarks/raw_results.json _site/benchmarks/raw_results.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
