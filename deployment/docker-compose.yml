services:
  agent-gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: agent-gateway:local
    ports:
      - "8080:8080"
    environment:
      - AGENT_GATEWAY_SQLITE_PATH=/app/data/agent_gateway.db
    volumes:
      - agent-gateway-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  agent-gateway-data:
